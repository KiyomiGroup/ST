<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Create a password — StreetTasker</title>
  <meta name="description" content="Start earning on StreetTasker. Create your password." />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/provider-start.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StreetTasker" />
</head>
<body class="st-shell">
  <!-- Onboarding step 3 of 4 for "Service provider". Password + accepting the terms, then the account is created
       and the person is sent to Log In with a "check your email" notice (same as the old sign-up form). -->
  <main class="st-page st-page--narrow ps-main">

    <div class="ps-top">
      <a href="provider-email.html" class="ps-back" aria-label="Back to your email">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div class="ps-progress" role="progressbar" aria-label="Sign-up progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3" aria-valuetext="Step 3 of 4">
        <span class="ps-progress-fill ps-progress-fill--3"></span>
      </div>
    </div>

    <div class="ps-head">
      <h1 class="ps-title">Create a password</h1>
      <p class="ps-lead">You will use it with <strong id="ppEmail" class="ps-email"></strong> to log in.</p>
    </div>

    <form class="ps-form" id="providerPasswordForm" novalidate>
      <div class="ps-field" id="ppField">
        <label class="sr-only" for="ppPassword">Password</label>
        <svg class="ps-field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input class="ps-input" type="password" id="ppPassword" name="password" placeholder="Create a password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="72" aria-describedby="ppHint" />
        <button type="button" class="ps-eye" id="ppEye" aria-label="Show password" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <!-- One short line at a time: the first thing still missing, in red. Turns green when the password is good. -->
      <div class="ps-meter" id="ppMeter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <p class="ps-hint" id="ppHint" aria-live="polite">Use 8 or more characters with a capital letter, a small letter, a number and a symbol.</p>

      <div class="av2-check-row ps-terms" id="ppTermsRow">
        <input type="checkbox" id="ppTerms" />
        <label for="ppTerms">I am 18 or over and I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a>, <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>, <a href="payments.html" target="_blank" rel="noopener">Payment, Commission and Wallet Policy</a> and <a href="community.html" target="_blank" rel="noopener">Community Standards</a>.</label>
      </div>
      <p class="ps-hint ps-hint--error" id="ppTermsError" role="alert" hidden></p>

      <p class="form-error ps-error" id="ppError" role="alert" hidden></p>

      <div class="ps-next-row">
        <button type="submit" class="ps-next is-ready" id="ppNext" aria-label="Create my account">
          <span>Create my account</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </form>

    <p class="ps-login">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/referral-capture.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/provider-password.js"></script>
  <script src="js/page-loader.js"></script>
</body>
</html>
