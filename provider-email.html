<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Your email — StreetTasker</title>
  <meta name="description" content="Start earning on StreetTasker. Enter your email address." />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/provider-start.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StreetTasker" />
</head>
<body class="st-shell">
  <!-- Onboarding step 2 of 4 for "Service provider". Email is compulsory. Goes on to the password page (provider-password.html). -->
  <main class="st-page st-page--narrow ps-main">

    <div class="ps-top">
      <a href="provider-start.html" class="ps-back" aria-label="Back to your name">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div class="ps-progress" role="progressbar" aria-label="Sign-up progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Step 2 of 4">
        <span class="ps-progress-fill ps-progress-fill--2"></span>
      </div>
    </div>

    <div class="ps-head">
      <h1 class="ps-title">What&rsquo;s your email?</h1>
      <p class="ps-lead">We use it to create your account and keep it safe.</p>
    </div>

    <form class="ps-form" id="providerEmailForm" novalidate>
      <label class="ps-field" for="peEmail">
        <span class="sr-only">Your email address</span>
        <svg class="ps-field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <input class="ps-input" type="email" id="peEmail" name="email" placeholder="Your email address" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="120" required />
      </label>

      <p class="form-error ps-error" id="peError" role="alert" hidden></p>

      <div class="ps-next-row">
        <button type="submit" class="ps-next is-ready" id="peNext" aria-label="Continue">
          <span>Continue</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </form>

    <p class="ps-login">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script src="js/provider-email.js"></script>
  <script src="js/page-loader.js"></script>
</body>
</html>
