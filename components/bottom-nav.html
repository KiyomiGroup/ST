<!-- StreetTasker — global mobile bottom nav (Home / Tasks / + (customers) or Service (taskers) / Messages / Profile)
     Injected on every page via js/app.js. Only visible when logged in —
     see body.st-logged-in gate in css/styles.css. Hrefs below are role-aware
     and get rewritten by the inline script once auth state is known. -->
<nav class="st-bottom-nav" id="stBottomNav" aria-label="Primary">
  <a href="home-feed.html" class="st-bn-item" id="stBnHome">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
    <span>Home</span>
  </a>
  <a href="find-taskers.html" class="st-bn-item" id="stBnTasks">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Tasks</span>
  </a>
  <a href="post-task.html" class="st-bn-plus" id="stBnPlus" aria-label="Post">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </a>
  <a href="messages.html" class="st-bn-item" id="stBnMessages">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Messages</span>
  </a>
  <a href="edit-profile-customer.html" class="st-bn-item" id="stBnProfile">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profile</span>
  </a>
</nav>
<script>
(function () {
  var role      = localStorage.getItem('st_role') || 'customer';
  var isTasker  = role === 'tasker';
  var dashUrl   = isTasker ? 'dashboard-tasker.html' : 'dashboard-customer.html';

  var elHome     = document.getElementById('stBnHome');
  var elTasks    = document.getElementById('stBnTasks');
  var elPlus     = document.getElementById('stBnPlus');
  var elMessages = document.getElementById('stBnMessages');
  var elProfile  = document.getElementById('stBnProfile');

  if (elHome)     elHome.href     = 'home-feed.html';
  if (elTasks)    elTasks.href    = isTasker ? 'find-tasks.html' : 'find-taskers.html';
  if (elPlus)     elPlus.href     = isTasker ? 'my-services.html' : 'post-task.html';
  /* Taskers: the round "+" becomes a normal tab, "Service" with the service (briefcase) icon, styled like Home / Tasks.
     Customers keep the "+" (post a task). The id stays, so the onboarding tours still find it. */
  if (elPlus && isTasker) {
    elPlus.className = 'st-bn-item';
    elPlus.setAttribute('aria-label', 'Service');
    elPlus.innerHTML = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span>Service</span>';
  }
  /* Messages is its own page (messages.html) for both roles. */
  if (elMessages) elMessages.href = 'messages.html';
  if (elProfile)  elProfile.href  = isTasker ? 'edit-profile-tasker.html' : 'edit-profile-customer.html';

  /* Active tab based on the current page */
  var page = (window.location.pathname.split('/').pop() || 'index.html');
  [elHome, elTasks, elPlus, elMessages, elProfile].forEach(function (el) {
    if (el && el !== elPlus) el.classList.remove('active');
    else if (el && isTasker) el.classList.remove('active');
  });
  if (page === 'home-feed.html') {
    if (elHome) elHome.classList.add('active');
  } else if (isTasker && (page === 'my-services.html' || page === 'post-service.html' || page === 'service-details.html')) {
    if (elPlus) elPlus.classList.add('active');
  } else if (page === 'edit-profile-tasker.html' || page === 'edit-profile-customer.html' || page === 'saved.html') {
    if (elProfile) elProfile.classList.add('active');
  } else if (page === dashUrl) {
    var hash  = window.location.hash.replace('#', '');
    var panel = new URLSearchParams(window.location.search).get('panel');
    var current = hash || panel || '';
    if (current === 'profile' && elProfile) elProfile.classList.add('active');
    else if (current === 'messages' && elMessages) elMessages.classList.add('active');
  } else if ((page === 'find-tasks.html' || page === 'find-taskers.html' || page === 'find-services.html') && elTasks) {
    elTasks.classList.add('active');
  } else if (page === 'messages.html' && elMessages) {
    elMessages.classList.add('active');
  }
})();
</script>
