<!-- StreetTasker — coordinator portal navigation (header, mobile drawer, mobile bottom bar).
     Loaded by js/coordinator.js into #coNavRoot on coordinator-*.html pages only.
     Links to pages that do not exist yet are plain <span class="is-soon"> items:
     4A-1 made My Local Taskers a link; 5B turns Bookings into one, 6B Messages. -->
<header class="co-header" id="coHeader">
  <div class="co-header-inner">
    <button type="button" class="co-icon-btn co-menu-btn" id="coMenuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="coDrawer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <a class="co-brand" href="coordinator-dashboard.html" aria-label="StreetTasker coordinator overview">
      <img src="images/logo-nav.svg" alt="StreetTasker" width="133" height="22" />
      <span class="co-brand-tag">Coordinator</span>
    </a>

    <nav class="co-nav" aria-label="Coordinator">
      <a class="co-nav-link" href="coordinator-dashboard.html" data-co-page="coordinator-dashboard.html">Overview</a>
      <a class="co-nav-link" href="coordinator-taskers.html" data-co-page="coordinator-taskers.html coordinator-tasker.html">My Local Taskers</a>
      <span class="co-nav-link is-soon" aria-disabled="true" title="Coming soon">Bookings</span>
      <span class="co-nav-link is-soon" aria-disabled="true" title="Coming soon">Messages</span>
      <span class="co-nav-link is-soon" aria-disabled="true" title="Coming soon">Help &amp; Support</span>
    </nav>

    <div class="co-account">
      <button type="button" class="co-avatar" id="coAvatarBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="coMenu" aria-label="Account menu">
        <span id="coAvatarInitials">CO</span>
      </button>
      <div class="co-menu" id="coMenu" role="menu" hidden>
        <p class="co-menu-name" id="coMenuName"></p>
        <p class="co-menu-sub">Coordinator account</p>
        <button type="button" class="co-menu-item" role="menuitem" id="coSignOut">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div class="co-drawer" id="coDrawer" hidden>
  <div class="co-drawer-backdrop" id="coDrawerBackdrop"></div>
  <nav class="co-drawer-panel" aria-label="Coordinator menu">
    <p class="co-drawer-name" id="coDrawerName"></p>
    <a class="co-drawer-link" href="coordinator-dashboard.html" data-co-page="coordinator-dashboard.html">Overview</a>
    <a class="co-drawer-link" href="coordinator-taskers.html" data-co-page="coordinator-taskers.html coordinator-tasker.html">My Local Taskers</a>
    <span class="co-drawer-link is-soon" aria-disabled="true">Bookings</span>
    <span class="co-drawer-link is-soon" aria-disabled="true">Messages</span>
    <span class="co-drawer-link is-soon" aria-disabled="true">Help &amp; Support</span>
    <button type="button" class="co-drawer-signout" id="coDrawerSignOut">Sign out</button>
  </nav>
</div>
