<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose a new password for your StreetTasker account." />
  <meta name="robots" content="noindex" />
  <title>Reset Password — StreetTasker</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- ══════════════════════════════════════════════════════════
       RESET PASSWORD
       The "Forgot password?" email links here. Supabase signs the person in
       with a short-lived recovery session; they pick a new password, then we
       sign them out and send them to Log In.
       ══════════════════════════════════════════════════════════ -->

  <section class="av2-page lg2-page">
    <div class="av2-shell lg2-shell">

      <div class="lg2-mobile-top">
        <div class="lg2-mobile-banner">
          <img src="images/illustration-community.jpg" alt="" />
        </div>
      </div>

      <div class="lg2-card fade-up">

        <div class="lg2-illustration">
          <img src="images/illustration-community.jpg" alt="StreetTasker community illustration" />
        </div>

        <div class="lg2-form-side">

          <div class="lg2-heading">
            <h1>Set a new password</h1>
            <p>Choose a strong password you don't use anywhere else.</p>
          </div>

          <div class="st-notice lg2-notice" id="resetNotice" hidden></div>

          <form id="resetForm" novalidate hidden>

            <div class="av2-field">
              <label for="newPwd">New password</label>
              <div class="av2-field-wrap">
                <svg class="av2-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="newPwd" name="password" placeholder="New password" autocomplete="new-password" aria-describedby="newPwdRules" required />
                <button type="button" class="av2-pwd-toggle" data-toggle="newPwd" aria-label="Show password">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <ul class="pwd-rules" id="newPwdRules" aria-live="polite"></ul>
            </div>

            <div class="av2-field">
              <label for="confirmPwd">Confirm new password</label>
              <div class="av2-field-wrap">
                <svg class="av2-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="confirmPwd" name="confirm" placeholder="Confirm new password" autocomplete="new-password" required />
                <button type="button" class="av2-pwd-toggle" data-toggle="confirmPwd" aria-label="Show password">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="form-error" id="resetErr" role="alert"></div>

            <button type="submit" class="btn btn-lg av2-submit-btn" id="resetBtn">
              <span>Update Password</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </form>

          <div class="av2-form-footer">Remembered it? <a href="login.html">Back to Log In</a></div>
        </div>

      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    const NOTICE_ICONS = {
      success: '<path d="M20 6 9 17l-5-5"/>',
      info:    '<path d="M12 11v6"/><path d="M12 7h.01"/>',
      warning: '<path d="M12 7v6"/><path d="M12 17h.01"/>',
      danger:  '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    };
    function showNotice(tone, title, body, link) {
      const box = document.getElementById('resetNotice');
      box.className = 'st-notice st-notice--' + tone + ' lg2-notice';
      box.setAttribute('role', tone === 'danger' ? 'alert' : 'status');
      box.textContent = '';
      const icon = document.createElement('span');
      icon.className = 'st-notice-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + NOTICE_ICONS[tone] + '</svg>';
      const main = document.createElement('div');
      main.className = 'st-notice-main';
      const t = document.createElement('div');
      t.className = 'st-notice-title';
      t.textContent = title;
      main.appendChild(t);
      if (body) {
        const b = document.createElement('div');
        b.className = 'st-notice-body';
        b.textContent = body;
        main.appendChild(b);
      }
      if (link) {
        const row = document.createElement('div');
        row.className = 'st-notice-actions';
        const a = document.createElement('a');
        a.className = 'st-notice-link';
        a.href = link.href;
        a.textContent = link.label;
        row.appendChild(a);
        main.appendChild(row);
      }
      box.append(icon, main);
      box.hidden = false;
    }

    function initPage() {
      const form  = document.getElementById('resetForm');
      const input = document.getElementById('newPwd');
      const again = document.getElementById('confirmPwd');
      const btn   = document.getElementById('resetBtn');
      const err   = document.getElementById('resetErr');

      window.ST.auth.attachPasswordRules(input, document.getElementById('newPwdRules'));

      document.querySelectorAll('[data-toggle]').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const field = document.getElementById(toggle.dataset.toggle);
          const show = field.type === 'password';
          field.type = show ? 'text' : 'password';
          toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
      });

      /* ── Is this a good reset link? ──────────────────────────────
         The link carries #access_token=…&type=recovery. supabase-js reads it and
         fires PASSWORD_RECOVERY. If the link was used already or timed out, the
         hash holds error_code=otp_expired instead. */
      const hash = new URLSearchParams(window.location.hash.slice(1));
      let ready = false;
      function openForm() {
        if (ready) return;
        ready = true;
        document.getElementById('resetNotice').hidden = true;
        form.hidden = false;
        input.focus();
      }
      function badLink() {
        if (ready) return;
        showNotice('warning', 'This reset link has expired',
          'Reset links work once and only for a short time. Request a new one from the Log In page.',
          { href: 'login.html', label: 'Back to Log In' });
      }

      /* Link from the email: reset-password.html?token_hash=...&type=recovery.
         Opening the page does NOT use up the link (mail scanners open links before the person does);
         the token is only checked when they press Continue. */
      const qs = new URLSearchParams(window.location.search);
      const tokenHash = qs.get('token_hash');
      if (tokenHash && qs.get('type') === 'recovery') {
        showNotice('info', 'Ready to reset your password', 'Press Continue to choose a new password.');
        const go = document.createElement('button');
        go.type = 'button';
        go.className = 'btn btn-primary';
        go.textContent = 'Continue';
        document.querySelector('#resetNotice .st-notice-main').appendChild(go);
        go.addEventListener('click', async () => {
          go.disabled = true;
          const { error } = await window.supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
          if (error) { badLink(); return; }
          window.history.replaceState(null, '', window.location.pathname);
          openForm();
        });
      } else {
        if (hash.get('error_code') || hash.get('error_description')) {
          badLink();
          return;
        }

        showNotice('info', 'Checking your reset link…', 'One moment.');
        window.supabase.auth.onAuthStateChange((event) => {
          if (event === 'PASSWORD_RECOVERY') openForm();
        });
        /* A recovery session may already be in place by the time we listen */
        setTimeout(async () => {
          const { data: { session } } = await window.supabase.auth.getSession();
          if (session && hash.get('type') === 'recovery') openForm();
          else if (session && !hash.get('access_token')) openForm();
          else badLink();
        }, 1500);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.style.display = 'none';
        const pwd = input.value;

        const problem = window.ST.auth.passwordProblem(pwd);
        if (problem) { err.textContent = problem; err.style.display = 'block'; return; }
        if (pwd !== again.value) { err.textContent = 'The two passwords do not match.'; err.style.display = 'block'; return; }

        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>Updating…</span>';
        try {
          const { error } = await window.supabase.auth.updateUser({ password: pwd });
          if (error) throw error;
          /* Sign out of the recovery session so they log in with the new password */
          try { await window.supabase.auth.signOut(); } catch (x) {}
          try { ['st_role', 'st_name', 'st_session', 'st_plan', 'st_email', 'st_avatar'].forEach(k => localStorage.removeItem(k)); } catch (x) {}
          window.location.replace('login.html?reset=1');
        } catch (ex) {
          btn.disabled = false;
          btn.innerHTML = original;
          const msg = ex && ex.message || '';
          err.textContent = /same password|different from the old/i.test(msg)
            ? 'Your new password must be different from your old one.'
            : /weak|password should|at least/i.test(msg)
            ? 'That password is too weak. ' + msg
            : (msg || 'Could not update your password. Please try again.');
          err.style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
