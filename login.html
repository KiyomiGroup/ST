<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Log in to your StreetTasker account." />
  <title>Log In — StreetTasker</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StreetTasker" />
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- ══════════════════════════════════════════════════════════
       LOGIN PAGE (v2 — Figma: "Log in" desktop / "Mobile Log in")
       ══════════════════════════════════════════════════════════ -->

  <section class="av2-page lg2-page">
    <div class="av2-shell lg2-shell">

      <!-- Mobile-only: wordmark + banner illustration behind the card -->
      <div class="lg2-mobile-top">
        <div class="lg2-mobile-banner">
          <img src="images/illustration-community.jpg" alt="" />
        </div>
      </div>

      <div class="lg2-card fade-up">

        <!-- Desktop-only illustration column -->
        <div class="lg2-illustration">
          <img src="images/illustration-community.jpg" alt="StreetTasker community illustration" />
        </div>

        <div class="lg2-form-side">

          <!-- desktop copy -->
          <div class="lg2-heading lg2-heading--desktop">
            <h1>Welcome back</h1>
            <p>Please enter your details to sign in.</p>
          </div>
          <!-- mobile copy -->
          <div class="lg2-heading lg2-heading--mobile">
            <h1>Welcome Back</h1>
            <p>Log in to continue building community.</p>
          </div>

          <!-- status notice: account created, email sent, link expired... (filled by showNotice) -->
          <div class="st-notice lg2-notice" id="loginNotice" hidden></div>

          <form id="loginForm" novalidate>

            <div class="av2-field">
              <label for="loginEmail" class="lg2-label-desktop">Email address</label>
              <div class="av2-field-wrap">
                <svg class="av2-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                <input type="email" id="loginEmail" name="email" class="lg2-input" placeholder="Email Address" autocomplete="email" required />
              </div>
            </div>

            <div class="av2-field">
              <label for="loginPwd" class="lg2-label-desktop">Password</label>
              <div class="av2-field-wrap">
                <svg class="av2-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="loginPwd" name="password" class="lg2-input" placeholder="Password" autocomplete="current-password" required />
                <button type="button" class="av2-pwd-toggle" id="pwdToggle" aria-label="Show password">
                  <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="lg2-row">
              <label class="lg2-remember">
                <input type="checkbox" id="rememberMe" />
                <span>Remember me</span>
              </label>
              <a href="#" class="lg2-forgot" onclick="handleForgotPassword(); return false;">Forgot password?</a>
            </div>

            <div class="form-error" id="loginErr"></div>

            <button type="submit" class="btn btn-lg av2-submit-btn" id="loginBtn">
              <span>Log In</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </form>

          <div class="av2-divider">or continue with</div>

          <!-- desktop: labelled pill buttons -->
          <div class="av2-oauth-row av2-oauth-row--full lg2-oauth-desktop">
            <button type="button" class="av2-oauth-btn" onclick="handleGoogleSignIn()">
              <img src="images/google-g.svg" width="18" height="18" alt="" aria-hidden="true">
              <span>Google</span>
            </button>
          </div>

          <!-- mobile: icon-only, circular -->
          <div class="av2-oauth-row av2-oauth-row--icons lg2-oauth-mobile">
            <button type="button" class="av2-oauth-btn" onclick="handleGoogleSignIn()" aria-label="Continue with Google">
              <img src="images/google-g.svg" width="18" height="18" alt="" aria-hidden="true">
              <span>Google</span>
            </button>
          </div>

          <div class="av2-form-footer">Don't have an account? <a href="signup.html">Sign up for free</a></div>
        </div>

      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Supabase CDN — must load before supabaseClient.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/referral-capture.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/saved.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* ── Where to go after login ──────────────────────────────────
       Pages send people here with ?redirect=<page>. Only a page on this
       site is accepted, so the link cannot send anyone to another site.
       Google leaves the site and come back without that parameter,
       so the destination is parked in this tab's sessionStorage first. */
    /* The redirect helpers (safeRedirect, requestedRedirect, rememberRedirect, takeRememberedRedirect)
       are defined in js/auth.js, so sign-up uses exactly the same rules. */

    /* ── Notice box (account created, email sent, link expired…) ──
       tone: success | info | warning | danger. All text goes in with textContent. */
    const NOTICE_ICONS = {
      success: '<path d="M20 6 9 17l-5-5"/>',
      info:    '<path d="M12 11v6"/><path d="M12 7h.01"/>',
      warning: '<path d="M12 7v6"/><path d="M12 17h.01"/>',
      danger:  '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    };
    function showNotice(tone, title, body, action) {
      const box = document.getElementById('loginNotice');
      if (!box) return null;
      box.className = 'st-notice st-notice--' + tone + ' lg2-notice';
      box.setAttribute('role', tone === 'danger' ? 'alert' : 'status');
      box.textContent = '';

      const icon = document.createElement('span');
      icon.className = 'st-notice-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + NOTICE_ICONS[tone] + '</svg>';

      const main = document.createElement('div');
      main.className = 'st-notice-main';
      const t = document.createElement('div');
      t.className = 'st-notice-title';
      t.textContent = title;
      main.appendChild(t);
      if (body) {
        const b = document.createElement('div');
        b.className = 'st-notice-body';
        b.textContent = body;
        main.appendChild(b);
      }
      let actionBtn = null;
      if (action) {
        const row = document.createElement('div');
        row.className = 'st-notice-actions';
        actionBtn = document.createElement('button');
        actionBtn.type = 'button';
        actionBtn.className = 'st-notice-link';
        actionBtn.textContent = action.label;
        actionBtn.addEventListener('click', () => action.onClick(actionBtn));
        row.appendChild(actionBtn);
        main.appendChild(row);
      }
      box.append(icon, main);
      box.hidden = false;
      return actionBtn;
    }
    /* Button that can only be pressed once a minute (Supabase limits how often it will send mail) */
    function cooldown(btn, label, seconds) {
      let left = seconds;
      btn.disabled = true;
      const tick = () => {
        if (left <= 0) { btn.disabled = false; btn.textContent = label; return; }
        btn.textContent = label + ' (' + left + 's)';
        left -= 1;
        setTimeout(tick, 1000);
      };
      tick();
    }

    /* A coordinator account is coordinator-only: it never signs in to the customer or tasker side. The database says who is a
       coordinator; if it cannot answer, the person is NOT turned away (a failed check must never lock a customer out).
       true = it is a coordinator account: they are signed out and told where to sign in. */
    let coordinatorCheck = null;   /* one check per page load, so Google's two callbacks cannot run it twice */
    function coordinatorAfterLogin(user) {
      if (!coordinatorCheck) coordinatorCheck = coordinatorCheckNow(user);
      return coordinatorCheck;
    }
    async function coordinatorCheckNow(user) {
      if (await isCoordinatorAccount()) {
        coordinatorBlocked = true;
        try { await window.supabase.auth.signOut(); } catch (e) { /* the page below still explains */ }
        try { ['st_role', 'st_name', 'st_session', 'st_email', 'st_avatar', 'st_uid'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
        showNotice('warning', 'This is a coordinator account',
          'Coordinator accounts have their own sign-in page and cannot be used as a customer or tasker account.',
          { label: 'Go to coordinator sign-in', onClick: () => { window.location.href = 'coordinator-login.html'; } });
        return true;
      }
      return false;
    }
    let coordinatorBlocked = false;
    async function isCoordinatorAccount() {
      try {
        const r = await window.supabase.rpc('is_coordinator');
        return !r.error && r.data === true;
      } catch (e) { return false; }
    }

    function initPage() {
      /* A password-reset link that landed here instead of reset-password.html
         (Supabase falls back to the site URL if the redirect is not on its allow list).
         Hand the whole link over so the person can set a new password. */
      if (window.location.hash.includes('type=recovery')) {
        window.location.replace('reset-password.html' + window.location.hash);
        return;
      }

      /* ── Google OAuth callback ─────────────────────────────────
         After the OAuth provider redirects back, Supabase fires
         onAuthStateChange. We read the role from the URL param
         (set by signup.html) and save it to the user's profile.
      ─────────────────────────────────────────────────────────── */
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('oauth') === '1') {
        showNotice('info', 'Signing you in…', 'One moment while we finish setting things up.');

        const oauthRole = urlParams.get('role')
          || (function(){ try { return localStorage.getItem('st_pending_role'); } catch(e){ return null; } })()
          || null; /* null = came from login, not signup */

        async function handleOAuthUser(session) {
          if (!session?.user) return;
          const uid = session.user.id;

          /* Check if this user already has an account in public.users */
          const { data: existingUser } = await window.supabase
            .from('users').select('id, role').eq('id', uid).maybeSingle();

          if (!existingUser) {
            /* Brand new account — need role selection before proceeding */
            if (!oauthRole) {
              /* Came from login page, not signup — block access */
              await window.supabase.auth.signOut();
              showNotice('danger', 'No account found', 'We could not find an account for that Google login. Please sign up first.');
              return;
            }
            /* Came from signup — create their account with the chosen role */
            try { localStorage.removeItem('st_pending_role'); } catch(e) {}
            await window.supabase.auth.updateUser({ data: { role: oauthRole } }).catch(() => {});
            await window.supabase.from('users').insert({
              id:    uid,
              name:  session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'User',
              role:  oauthRole,
              email: session.user.email,
            }).catch(() => {});
            localStorage.setItem('st_role', oauthRole);
            localStorage.setItem('st_name', session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'User');
            /* Referral (M14): Google has no sign-up form, so hand the stored visit id to the database once. It decides; a failure changes nothing. */
            try {
              const refVisit = window.STReferral && window.STReferral.visitId();
              if (refVisit) { await window.supabase.rpc('referral_claim', { p_visit: refVisit }); window.STReferral.clear(); }
            } catch (e) {}
            /* First time in: where they clicked before signing up, else their first-time page */
            const backTo = takeRememberedRedirect();
            await window.ST.auth.markWelcomed();
            if (await coordinatorAfterLogin(session.user)) return;
            window.location.replace(backTo || window.ST.auth.firstLoginUrl(oauthRole));
          } else {
            /* Existing account — log them in to their correct dashboard */
            try { localStorage.removeItem('st_pending_role'); } catch(e) {}
            let role = existingUser.role || oauthRole || 'customer';
            /* Came from Sign up as the other kind of account: add it to this login (or switch to it) */
            if (oauthRole && oauthRole !== role) {
              try {
                const held = await window.ST.auth.getMyRoles(session.user);
                if (held.indexOf(oauthRole) === -1) await window.ST.auth.addRole(oauthRole);
                else await window.ST.auth.switchRole(oauthRole);
                role = oauthRole;
              } catch (e) { /* keep the role they already had */ }
            }
            localStorage.setItem('st_role', role);
            localStorage.setItem('st_name', session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'User');
            if (await coordinatorAfterLogin(session.user)) return;
            window.location.replace(takeRememberedRedirect() || window.ST.auth.getHomeUrl());
          }
        }

        window.supabase.auth.onAuthStateChange(async (event, session) => {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session?.user) {
            await handleOAuthUser(session);
          }
        });

        setTimeout(async () => {
          const { data: { session } } = await window.supabase.auth.getSession();
          if (session?.user) await handleOAuthUser(session);
        }, 1500);
        return;
      }

      /* ── Email confirmation redirect ── */
      const hash = window.location.hash;
      if (hash && hash.includes('access_token') && hash.includes('type=signup')) {
        showNotice('info', 'Confirming your email…', 'This only takes a moment.');
        /* They clicked the link in the confirmation email. Make sure their profile
           rows exist, then sign them out and send them to Log In to sign in. */
        let confirmDone = false;
        async function finishConfirmation(session) {
          if (confirmDone || !session?.user) return;
          confirmDone = true;
          const u = session.user;
          const role = u.user_metadata?.role || 'customer';
          const name = u.user_metadata?.name || u.email.split('@')[0];
          try {
            await window.supabase.from('users').upsert({ id: u.id, name, email: u.email, role }, { onConflict: 'id' });
            if (role === 'tasker') {
              await window.supabase.from('taskers').upsert(
                { id: u.id, user_id: u.id, name, email: u.email, service: '', location: '', rating: 0, task_count: 0 },
                { onConflict: 'id' }
              );
            }
          } catch (e) { /* rows are re-checked at login */ }
          try { await window.supabase.auth.signOut(); } catch (e) {}
          try { ['st_role', 'st_name', 'st_session', 'st_email', 'st_avatar'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
          window.location.replace('login.html?confirmed=1&email=' + encodeURIComponent(u.email));
        }
        window.supabase.auth.onAuthStateChange((event, session) => {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session?.user) finishConfirmation(session);
        });
        setTimeout(async () => {
          const session = await window.ST.auth.getSession();
          if (session) finishConfirmation(session);
        }, 1500);
        return;
      }

      /* ── Expired or invalid confirmation link ── */
      if (window.location.hash.includes('error_description')) {
        const h = new URLSearchParams(window.location.hash.slice(1));
        if (h.get('error_code') === 'otp_expired') {
          showNotice('warning', 'That link has expired',
            'It was already used or is too old. Try logging in below. If it says your email isn\'t verified, sign up again to get a new link.');
        } else {
          showNotice('danger', 'That link is not valid', (h.get('error_description') || 'Please request a new one.').replace(/\+/g, ' '));
        }
      }

      /* ── Just signed up / confirmed / reset: show the matching notice ── */
      const qs = new URLSearchParams(window.location.search);
      const mail = qs.get('email') || '';
      if (qs.get('verify') === '1' || qs.get('created') === '1' || qs.get('confirmed') === '1') {
        if (mail) document.getElementById('loginEmail').value = mail;
        if (qs.get('confirmed') === '1') {
          showNotice('success', 'Email confirmed', 'Your account is ready. Log in below to continue.');
        } else if (qs.get('verify') === '1') {
          showNotice('success', 'Account created',
            'We sent a verification link to ' + (mail || 'your email') + '. Verify your email, then log in below. It can take a few minutes, so check your spam folder too.',
            mail ? { label: 'Resend email', onClick: async (btn) => {
              cooldown(btn, 'Resend email', 60);
              const { error } = await window.supabase.auth.resend({
                type: 'signup', email: mail,
                options: { emailRedirectTo: window.location.origin + '/login.html' }
              });
              showToast(error ? 'Could not resend: ' + error.message : 'Verification email sent to ' + mail + '.');
            } } : null);
        } else {
          showNotice('success', 'Account created', 'Log in below to continue.');
        }
      }
      if (qs.get('reset') === '1') {
        showNotice('success', 'Password updated', 'Your password was changed. Log in below with your new password.');
      }

      /* "Sign up for free" keeps the page they were trying to reach */
      const toSignup = document.querySelector('.av2-form-footer a[href="signup.html"]');
      if (toSignup) toSignup.setAttribute('href', 'signup.html' + window.ST.auth.redirectQuery());

      /* ── Password toggle ── */
      const toggle = document.getElementById('pwdToggle');
      const input  = document.getElementById('loginPwd');
      const icon   = document.getElementById('eyeIcon');
      if (toggle) {
        toggle.addEventListener('click', () => {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          icon.innerHTML = show
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });
      }

      /* ── If already logged in, redirect away ── */
      window.ST.auth.getSession().then(async session => {
        if (session) {
          if (await coordinatorAfterLogin(session.user)) return;
          window.location.href = requestedRedirect() || window.ST.auth.getHomeUrl();
        }
      });

      const form = document.getElementById('loginForm');
      const btn  = document.getElementById('loginBtn');
      const err  = document.getElementById('loginErr');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.style.display = 'none';

        const email = form.email.value.trim();
        const pwd   = form.password.value;

        if (!email || !pwd) { showErr('Please enter your email and password.'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Please enter a valid email.'); return; }

        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<span>Logging in…</span>';
        btn.disabled = true;

        try {
          const { user } = await window.ST.auth.loginUser(email, pwd);

          /* A coordinator account is turned away here and sent to the coordinator sign-in */
          if (await coordinatorAfterLogin(user)) {
            if (coordinatorBlocked) { btn.innerHTML = originalHTML; btn.disabled = false; return; }   /* coordinator account: signed out, told where to sign in */
            if (window.ST.auth.isFirstLogin(user)) await window.ST.auth.markWelcomed();
            return;
          }

          /* Where to: the page they came for, else (first log-in only) post a service / post a task, else home */
          const role     = await window.ST.auth.getUserRole(user);
          const first    = window.ST.auth.isFirstLogin(user);
          const redirect = requestedRedirect() || window.ST.auth.takeSignupTarget(email);
          if (first) await window.ST.auth.markWelcomed();

          if (redirect) {
            showToast('Welcome back! Redirecting...');
            setTimeout(() => { window.location.href = redirect; }, 800);
          } else if (first) {
            showToast(role === 'tasker' ? 'Welcome! Let\'s post your first service.' : 'Welcome! Let\'s post your first task.');
            setTimeout(() => { window.location.href = window.ST.auth.firstLoginUrl(role); }, 800);
          } else if (role === 'tasker') {
            try {
              const { data: tRow } = await window.supabase.from('taskers')
                .select('service, service_name, location')
                .eq('user_id', user.id).maybeSingle();
              const hasProfile = tRow && (tRow.service || tRow.service_name) && tRow.location;
              if (!hasProfile) {
                showToast('Welcome! Let\'s set up your profile first.');
                setTimeout(() => { window.location.href = 'dashboard-tasker.html?setup=1'; }, 800);
                return;
              }
            } catch(e) {}
            showToast('Welcome back! Taking you home...');
            setTimeout(() => { window.location.href = window.ST.auth.getHomeUrl(); }, 800);
          } else {
            showToast('Welcome back! Taking you home...');
            setTimeout(() => { window.location.href = window.ST.auth.getHomeUrl(); }, 800);
          }

        } catch (authErr) {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          showErr(friendlyAuthError(authErr.message));
        }
      });

      function showErr(msg) { err.textContent = msg; err.style.display = 'block'; }

      function friendlyAuthError(msg) {
        if (!msg) return 'Login failed. Please try again.';
        if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) return 'Incorrect email or password.';
        if (msg.includes('Email not confirmed')) return 'Your email isn\'t verified yet. Please click the link we emailed you, then log in.';
        if (msg.includes('Too many requests')) return 'Too many attempts. Please wait a moment and try again.';
        return msg;
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('loginEmail')?.value?.trim();
      if (!email) { showToast('Enter your email address first, then click Forgot password.'); document.getElementById('loginEmail')?.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email address.'); return; }
      try {
        /* The link in the email opens reset-password.html, where they choose a new password */
        const { error } = await window.supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password.html'
        });
        if (error) throw error;
        showNotice('success', 'Check your email',
          'If an account exists for ' + email + ', we sent a link to reset your password. It can take a few minutes, so check your spam folder too.',
          { label: 'Send again', onClick: (btn) => { cooldown(btn, 'Send again', 60); handleForgotPassword(); } });
        const again = document.querySelector('#loginNotice .st-notice-link');
        if (again) cooldown(again, 'Send again', 60);
      } catch (e) {
        const limited = e && (e.status === 429 || /rate limit|too many/i.test(e.message || ''));
        showNotice('danger', limited ? 'Please wait a minute' : 'Could not send the email',
          limited ? 'We just sent a reset email. Wait a minute before asking for another.' : (e.message || 'Please try again.'));
      }
    }
    window.handleForgotPassword = handleForgotPassword;

    async function handleGoogleSignIn() {
      rememberRedirect();
      try {
        const { error } = await window.supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/login.html?oauth=1' }
        });
        if (error) throw error;
      } catch(e) { showToast('Google sign-in failed: ' + e.message); }
    }
    window.handleGoogleSignIn = handleGoogleSignIn;


  </script>
