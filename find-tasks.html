<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2E1C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Browse open tasks posted by customers and apply to earn with your skills on StreetTasker." />
  <title>Find Tasks Near You — StreetTasker</title>
  <link rel="canonical" href="https://streettasker.com/find-tasks.html" />
  <link rel="stylesheet" href="css/styles.css?v=22" />
  <link rel="stylesheet" href="css/categories.css?v=1" />
  <link rel="stylesheet" href="css/tasks.css?v=22" />
  <link rel="stylesheet" href="css/cards-v2.css?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StreetTasker" />
  <link rel="stylesheet" href="css/onboarding.css" />
</head>
<body class="spg-page">
  <div id="navbar-placeholder"></div>

  <div class="spg-sticky-top spg-sticky-top--pinned">
    <div class="container">
      <div class="spg-hero">
        <div class="spg-hero-text">
          <div class="spg-hero-eyebrow fade-up" id="spgHeroEyebrow" data-logged-in-label="Find Tasks">
            <span class="spg-hero-dot"></span> <span id="spgHeroEyebrowText">Open Tasks</span>
          </div>
          <h1 class="fade-up d1"><span id="spgHeroHeadline">Find your dream task here</span> <svg class="spg-hero-spark" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></h1>
          <p class="fade-up d2" id="spgHeroSub">Connect with local verified clients and taskers for everyday services.</p>
        </div>
        <div class="spg-hero-avatar" id="spgHeroAvatar" style="display:none;">
          <img id="spgHeroAvatarImg" alt="" style="display:none;" />
          <span id="spgHeroAvatarInitial"></span>
        </div>
      </div>
      <form id="taskSearchForm" class="spg-searchbar spg-searchbar--wide fade-up d3" novalidate>
        <div class="spg-searchbar-field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="taskSearchInput" placeholder="Task title or keyword..." autocomplete="off" />
        </div>
        <div class="spg-searchbar-divider spg-searchbar-location-wrap"></div>
        <div class="spg-searchbar-field spg-searchbar-location-wrap" style="position:relative;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          <input type="text" id="taskLocationInput" placeholder="Add location or area (e.g. Lagos, Lekki)" autocomplete="off" class="has-gps-btn" />
          <div id="taskLocationSuggestions" class="location-suggestions"></div>
        </div>
        <button type="submit" class="btn btn-primary">
          <span>Search</span>
          <svg class="spg-search-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>
  </div>

  <div class="spg-content-below" style="padding:0 0 64px; background:var(--bg-subtle); margin-top:32px;">
    <div class="container">
    <div class="spg-tab-toggle spg-tab-toggle-top">
      <a href="find-tasks.html" class="spg-tab active">Tasks</a>
      <a href="find-taskers.html" class="spg-tab">Taskers</a>
      <a href="find-services.html" class="spg-tab">Services</a>
    </div>
      <div class="spg-layout">

        <!-- Filters -->
        <aside class="filter-sidebar">
          <div class="filter-panel">
            <div class="filter-group">
              <div class="filter-group-label filter-group-label-row">
                <span>Task Type</span>
                <button class="filter-reset" id="taskFilterReset">Clear all</button>
              </div>
              <label class="filter-opt"><input type="checkbox" name="ttype" value="full_time" /> Full time <span class="filter-opt-count" data-count-type="full_time"></span></label>
              <label class="filter-opt"><input type="checkbox" name="ttype" value="part_time" /> Part time <span class="filter-opt-count" data-count-type="part_time"></span></label>
              <label class="filter-opt"><input type="checkbox" name="ttype" value="one_off" /> One-off <span class="filter-opt-count" data-count-type="one_off"></span></label>
              <label class="filter-opt"><input type="checkbox" name="ttype" value="remote" /> Remote <span class="filter-opt-count" data-count-type="remote"></span></label>
              <label class="filter-opt"><input type="checkbox" name="ttype" value="in_person" /> In person <span class="filter-opt-count" data-count-type="in_person"></span></label>
            </div>

            <div class="filter-group">
              <div class="filter-group-label">Budget Range</div>
              <div class="range-wrap">
                <input type="range" class="filter-range" id="budgetRange" min="0" max="100000" value="0" step="500" />
                <div class="range-labels"><span>₦0</span><span id="budgetVal">Any</span><span>₦100k</span></div>
              </div>
            </div>

            <div class="filter-group">
              <div class="filter-group-label">Task Urgency</div>
              <label class="filter-opt"><input type="checkbox" name="turg" value="immediate" /> Immediate <span class="filter-opt-count" data-count-urgency="immediate"></span></label>
              <label class="filter-opt"><input type="checkbox" name="turg" value="flexible" /> Flexible <span class="filter-opt-count" data-count-urgency="flexible"></span></label>
              <label class="filter-opt"><input type="checkbox" name="turg" value="scheduled" /> Scheduled <span class="filter-opt-count" data-count-urgency="scheduled"></span></label>
            </div>

            <div class="filter-group">
              <div class="filter-group-label">Task Categories</div>
              <div class="filter-chip-cloud" id="taskCategoryChips">
                <button type="button" class="filter-chip" data-tcat="barber">Barber</button>
                <button type="button" class="filter-chip" data-tcat="electrician">Electrician</button>
                <button type="button" class="filter-chip" data-tcat="cleaning">Cleaning</button>
                <button type="button" class="filter-chip" data-tcat="mechanic">Mechanic</button>
                <button type="button" class="filter-chip" data-tcat="plumber">Plumber</button>
                <button type="button" class="filter-chip" data-tcat="beauty">Make-up</button>
                <button type="button" class="filter-chip" data-tcat="other">Other</button>
              </div>
            </div>
          </div>
        </aside>

        <!-- Tasks -->
        <main>
          <div class="results-bar">
            <div class="spg-results-head" style="display:flex; align-items:center; gap:16px;">
              <h2 class="spg-results-heading">Recommended Tasks</h2>
            </div>
          </div>

          <div id="tasksLoading" style="text-align:center; padding:40px; color:var(--text-muted);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite;display:block;margin:0 auto 12px;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading tasks...
          </div>
          <div id="tasksGrid" class="spg-grid"></div>
          <div id="tasksEmpty" class="empty-state" style="display:none;">
            <div class="empty-state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
            <h3>No tasks found</h3>
            <p>Try a different search or check back later.</p>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Mobile bottom tab bar now comes from the shared, global
       components/bottom-nav.html (loaded by js/app.js) so it's
       consistent across the whole site and only shows when logged in. -->
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .task-row { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 24px; transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease); }
    .task-row:hover { border-color:var(--border-strong); box-shadow:var(--shadow-sm); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ng-places.js"></script>
  <script src="js/location.js"></script>
  <script>
    let ALL_TASKS = [];
    let TASK_FILTERS = { search: '', category: '', location: '', minBudget: 0, types: [], urgencies: [] };

    async function initPage() {
      /* Older links (?task=ID, labelled "View Task Details") go straight to the task page */
      const _tid = (new URLSearchParams(window.location.search).get('task') || '').trim();
      if (_tid) { window.location.replace('task-details.html?id=' + encodeURIComponent(_tid)); return; }
      try {
        ALL_TASKS = await window.ST.db.fetchTasks({ limit: 100 });
      } catch (e) {
        document.getElementById('tasksLoading').innerHTML = `<p style="color:var(--red)">Could not load tasks: ${e.message}</p>`;
        return;
      }
      document.getElementById('tasksLoading').style.display = 'none';
      updateFilterCounts();
      renderTasks();

      /* Search */
      const si = document.getElementById('taskSearchInput');
      const sf = document.getElementById('taskSearchForm');
      if (si) si.addEventListener('input', () => { TASK_FILTERS.search = si.value.trim(); renderTasks(); });
      if (sf) sf.addEventListener('submit', e => { e.preventDefault(); renderTasks(); });

      /* Location with Nominatim autocomplete + GPS */
      initLocationInput({
        inputId:    'taskLocationInput',
        dropdownId: 'taskLocationSuggestions',
        gps: true,
        onSelect: r => { TASK_FILTERS.location = r.label; renderTasks(); },
        onChange: v => { TASK_FILTERS.location = v.trim(); renderTasks(); },
        mode: 'area',
      });

      /* Prefill from the Home search (?q=...&location=...) */
      const _qs = new URLSearchParams(window.location.search);
      const _q0 = (_qs.get('q') || _qs.get('service') || '').trim();
      const _l0 = (_qs.get('location') || '').trim();
      const _li = document.getElementById('taskLocationInput');
      if (_q0 && si) { si.value = _q0; TASK_FILTERS.search = _q0; }
      if (_l0 && _li) { _li.value = _l0; TASK_FILTERS.location = _l0; }
      if (_q0 || _l0) renderTasks();

      /* Task Type checkboxes */
      document.querySelectorAll('[name="ttype"]').forEach(cb => cb.addEventListener('change', () => {
        TASK_FILTERS.types = [...document.querySelectorAll('[name="ttype"]:checked')].map(c => c.value);
        renderTasks();
      }));

      /* Task Urgency checkboxes */
      document.querySelectorAll('[name="turg"]').forEach(cb => cb.addEventListener('change', () => {
        TASK_FILTERS.urgencies = [...document.querySelectorAll('[name="turg"]:checked')].map(c => c.value);
        renderTasks();
      }));

      /* Category chips (multi-select): every category from js/categories.js, with its icon */
      const _cloud = document.getElementById('taskCategoryChips');
      if (_cloud && window.STCat) {
        _cloud.innerHTML = STCat.list.map(c =>
          '<button type="button" class="filter-chip" data-tcat="' + c.value + '">' + STCat.iconHtml(c.value) + c.short + '</button>').join('');
        /* a link like find-tasks.html?category=cleaning opens with that chip on */
        const _c0 = (new URLSearchParams(window.location.search).get('category') || '').trim();
        if (_c0) {
          const g = STCat.resolve(_c0).value, chip = _cloud.querySelector('[data-tcat="' + g + '"]');
          if (chip) { chip.classList.add('active'); TASK_FILTERS.category = [g]; renderTasks(); }
        }
      }
      /* Category chips (multi-select) */
      document.querySelectorAll('#taskCategoryChips [data-tcat]').forEach(chip => chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        const active = [...document.querySelectorAll('#taskCategoryChips .filter-chip.active')].map(c => c.dataset.tcat);
        TASK_FILTERS.category = active; // array now, filtered() handles both shapes
        renderTasks();
      }));

      /* Budget */
      const br = document.getElementById('budgetRange');
      const bv = document.getElementById('budgetVal');
      if (br) br.addEventListener('input', () => {
        TASK_FILTERS.minBudget = parseInt(br.value);
        if (bv) bv.textContent = TASK_FILTERS.minBudget > 0 ? '₦' + TASK_FILTERS.minBudget.toLocaleString() : 'Any';
        renderTasks();
      });

      /* Reset */
      document.getElementById('taskFilterReset')?.addEventListener('click', () => {
        TASK_FILTERS = { search:'', category:'', location:'', minBudget:0, types:[], urgencies:[] };
        if (si) si.value = '';
        const li = document.getElementById('taskLocationInput'); if (li) li.value = '';
        if (br) { br.value = 0; if (bv) bv.textContent = 'Any'; }
        document.querySelectorAll('[name="ttype"],[name="turg"]').forEach(c => c.checked = false);
        document.querySelectorAll('#taskCategoryChips .filter-chip').forEach(c => c.classList.remove('active'));
        renderTasks();
      });
    }

    function updateFilterCounts() {
      document.querySelectorAll('[data-count-type]').forEach(el => {
        el.textContent = ALL_TASKS.filter(t => t.task_type === el.dataset.countType).length || '';
      });
      document.querySelectorAll('[data-count-urgency]').forEach(el => {
        el.textContent = ALL_TASKS.filter(t => t.urgency === el.dataset.countUrgency).length || '';
      });
    }

    function renderTasks() {
      const grid = document.getElementById('tasksGrid');
      const cnt  = document.getElementById('taskCount');
      const emp  = document.getElementById('tasksEmpty');
      let f = [...ALL_TASKS];
      if (TASK_FILTERS.search) {
        const q = TASK_FILTERS.search.toLowerCase();
        f = f.filter(t => (t.title||'').toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q));
      }
      if (TASK_FILTERS.category && TASK_FILTERS.category.length) f = f.filter(t => window.STCat ? TASK_FILTERS.category.some(g => STCat.matches(t.category, g)) : TASK_FILTERS.category.includes(t.category));
      if (TASK_FILTERS.location) {
        const loc = TASK_FILTERS.location.toLowerCase();
        f = f.filter(t => (t.location||'').toLowerCase().includes(loc));
      }
      if (TASK_FILTERS.minBudget > 0) f = f.filter(t => !(Number(t.budget) > 0) || t.budget >= TASK_FILTERS.minBudget); /* No budget tasks stay visible: the tasker names the price */
      if (TASK_FILTERS.types.length) f = f.filter(t => TASK_FILTERS.types.includes(t.task_type || 'one_off'));
      if (TASK_FILTERS.urgencies.length) f = f.filter(t => TASK_FILTERS.urgencies.includes(t.urgency || 'flexible'));

      if (cnt) cnt.textContent = f.length;
      if (f.length === 0) { grid.innerHTML = ''; emp.style.display = 'block'; return; }
      emp.style.display = 'none';
      grid.innerHTML = f.map(buildTaskCard).join('');
    }

    /* Card markup lives in js/ui.js (stTaskCard). Clicking a card opens the Make an Offer page
       (login and tasker checks happen there); "View Details" is a real link to the task page. */
    function buildTaskCard(t) { return stTaskCard(t); }
    document.getElementById('tasksGrid').addEventListener('click', function (ev) {
      if (ev.target.closest('.st-card-save') || ev.target.closest('a')) return;
      const card = ev.target.closest('.st-card--task');
      if (!card || !card.dataset.taskId) return;
      window.location.href = 'make-offer.html?task=' + encodeURIComponent(card.dataset.taskId);
    });
  </script>
  <script>
    /* Keep the fixed nav+hero+search block (mobile only) from overlapping
       the results below it — measure its real height and pad the content. */
    (function () {
      function sync() {
        var sticky = document.querySelector('.spg-sticky-top');
        var below  = document.querySelector('.spg-content-below');
        if (!sticky || !below) return;
        if (window.matchMedia('(max-width: 768px)').matches) {
          below.style.paddingTop = sticky.getBoundingClientRect().height + 'px';
        } else {
          below.style.paddingTop = '';
        }
      }
      window.addEventListener('load', sync);
      window.addEventListener('resize', sync);
      setTimeout(sync, 300); /* fonts can reflow text height shortly after load */
    })();
  </script>
  <script src="js/onboarding.js"></script>
  <script src="js/onboarding-tours-tasker.js"></script>
</body>
</html>
